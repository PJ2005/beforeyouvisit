name: CI/CD

on:
  push:

env:
  REGISTRY: ghcr.io
  # OCI repository paths must be lowercase. This is the canonical GHCR path
  # for the PJ2005/beforeyouvisit repository.
  IMAGE_NAME: ghcr.io/pj2005/beforeyouvisit

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: mvn clean verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Make the GHCR package public for AKS pulls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/user/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public

  deploy-aks:
    name: Deploy to AKS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate with Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Update deployment and wait for rollout
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl set image deployment/beforeyouvisit beforeyouvisit="$IMAGE"
          kubectl rollout status deployment/beforeyouvisit --timeout=180s

      - name: Verify application health
        run: |
          set -euo pipefail
          kubectl port-forward service/beforeyouvisit 18080:8080 >/tmp/beforeyouvisit-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 3
          done
          cat /tmp/beforeyouvisit-port-forward.log
          exit 1
