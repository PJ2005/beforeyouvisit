apiVersion: apps/v1
kind: Deployment
metadata:
  name: beforeyouvisit
  labels:
    app.kubernetes.io/name: beforeyouvisit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beforeyouvisit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beforeyouvisit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 999
      containers:
        - name: beforeyouvisit
          image: beforeyouvisit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: beforeyouvisit-config
                  key: APP_VERSION
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
