apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: beforeyouvisit
    newName: beforeyouvisit
    newTag: "1.0.0"
patches:
  - target:
      kind: Service
      name: beforeyouvisit
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 80
